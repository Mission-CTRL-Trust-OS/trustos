[build]
publish = "."

[functions]
directory = "netlify/functions"

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/*.png"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/favicon*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

# Redirect the Netlify subdomain to the primary domain (301, forced)
[[redirects]]
from = "https://missionctrl-trustos.netlify.app/*"
to = "https://trustos.missionctrl.agency/:splat"
status = 301
force = true
